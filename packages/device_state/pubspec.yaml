name: device_state
description: Tells Dardasha whether the phone is in use (screen on and unlocked). Works in background isolates too.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.dardasha.device_state
        pluginClass: DeviceStatePlugin
